    <!-- Import Barcode Font from Google Fonts -->

    <style>

            background: #d4d4d4;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .portal-nav {
            max-width: 900px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .doc-btn {
            background: #5b1184;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .doc-btn.active {
            background: #380853;
            border: 2px solid #ffd700;
        }
        .document-sheet {
            display: none;
            max-width: 850px;
            background: #ffffff;
            margin: auto;
            padding: 30px;
            border: 8px double #5b1184;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);

            justify-content: space-between;

            font-weight: bold;
            margin-bottom: 10px;

        .barcode-box {

            line-height: 1;
            letter-spacing: 0px;
            margin-bottom: -5px;

            height: 105px;

            background: #eee;
            text-align: center;
            font-size: 10px;
            line-height: 105px;
            color: #666;

            font-weight: bold;
            text-decoration: underline;
            margin: 20px 0;
            color: #000;

            gap: 10px;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .pc-body-text {
            font-size: 14px;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 40px;
        }
        .fill-line {
            border-bottom: 1px dotted #000;
            padding: 0 10px;
            font-weight: bold;
        }

        /* Consolidated Grade Sheet Styles */
        .cgs-header-title {
            background-color: #5b1184;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .cgs-info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-bottom: 15px;
        }
        .cgs-info-table td {
            border: 1px solid #444;
            padding: 5px 8px;
        }
        .year-block-title {

            text-align: center;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #444;
            padding: 4px;
        }
        .cgs-table-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;

            font-size: 10px;

            color: #000;

            margin-top: 30px;
            font-size: 12px;
            font-weight: bold;
        }

            document.querySelectorAll('.document-sheet').forEach(el => el.classList.remove('active'));

            document.getElementById('sheet-' + type).classList.add('active');

</body>
