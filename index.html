<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Narsimha Reddy Engineering College - Marks Memo</title>
    <style>
        body {
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .memo-container {
            max-width: 800px;
            background: #ffffff;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .college-header {
            background-color: #5b1184; /* NRCM Purple Theme */
            color: white;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
        }
        .college-header h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        .college-header p { margin: 5px 0 0; font-size: 11px; }
        .results-title {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            text-decoration: underline;
            margin-bottom: 15px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .info-table td {
            border: 1px solid #000;
            padding: 8px;
            font-size: 13px;
        }
        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .marks-table th, .marks-table td {
            border: 1px solid #000;
            padding: 6px 8px;
            text-align: center;
            font-size: 12px;
        }
        .marks-table th {
            background-color: #f2f2f2;
            color: #000;
        }
        .marks-table td:nth-child(3) {
            text-align: left; /* Subject name left aligned */
        }
        .summary-section {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 40px;
            display: flex;
            gap: 40px;
        }
        .footer {
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            margin-top: 40px;
        }
        .error-box {
            text-align: center;
            padding: 40px;
            color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="memo-container" id="memoContent">
        <div class="error-box"><h2>Loading Marks Memo...</h2></div>
    </div>

    <script>
        // Database mapped by your unique secure token
        const studentDatabase = {
            "248891deab574c4b8173a6dead509b24": {
                htno: "21X01A6720",
                name: "KYTHAM SHASHIPRETHAM",
                fatherName: "KYTHAM SRIDHAR",
                department: "CSE(DS)",
                examTitle: "Results of IV B.TECH II SEM (NR19), June 2022",
                sgpa: "6.75",
                cgpa: "",
                subjects: [
                    { sno: 1, subCode: "SM4201MS", name: "ORGANIZATIONAL BEHAVIOR", monthYear: "June 2025", grade: "C", credits: "3.00", status: "PASS" },
                    { sno: 2, subCode: "ME4233OE", name: "RENEWABLE ENERGY SOURCES", monthYear: "June 2025", grade: "C", credits: "3.00", status: "PASS" },
                    { sno: 3, subCode: "DS4206PE", name: "HUMAN COMPUTER INTERACTION", monthYear: "April 2025", grade: "C", credits: "3.00", status: "PASS" },
                    { sno: 4, subCode: "DS4202PC", name: "PROJECT STAGE - II", monthYear: "April 2025", grade: "A+", credits: "7.00", status: "PASS" }
                ]
            }
        };

        // Extract token from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('memoContent');

        if (token && studentDatabase[token]) {
            const student = studentDatabase[token];
            let tableRows = '';

            student.subjects.forEach(sub => {
                tableRows += `
                    <tr>
                        <td>${sub.sno}</td>
                        <td>${sub.subCode}</td>
                        <td>${sub.name}</td>
                        <td>${sub.monthYear}</td>
                        <td>${sub.grade}</td>
                        <td>${sub.credits}</td>
                        <td>${sub.status}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="college-header">
                    <h2>NARSIMHA REDDY ENGINEERING COLLEGE</h2>
                    <p>JAKKULA EDUCATIONAL SOCIETY</p>
                </div>
                
                <div class="results-title">${student.examTitle}</div>

                <table class="info-table">
                    <tr>
                        <td><strong>H.T.No :</strong> ${student.htno}</td>
                        <td><strong>Name :</strong> ${student.name}</td>
                    </tr>
                    <tr>
                        <td><strong>Father Name :</strong> ${student.fatherName}</td>
                        <td><strong>Department :</strong> ${student.department}</td>
                    </tr>
                </table>

                <table class="marks-table">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>SubCode</th>
                            <th>Subject</th>
                            <th>Month & Year</th>
                            <th>Grades</th>
                            <th>Credits (C)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <div class="summary-section">
                    <div>SGPA : ${student.sgpa}</div>
                    <div>CGPA : ${student.cgpa}</div>
                </div>

                <div class="footer">
                    Controller of Examinations
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="error-box">
                    <h2>Invalid or Expired Security Token</h2>
                    <p>This verification link is invalid, or the security token was not provided.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
