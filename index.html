<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Narsimha Reddy Engineering College - Complete B.Tech Transcript (1-1 to 4-2)</title>
    <style>
        body {
            background: #eef2f5;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            color: #000;
        }
        .memo-container {
            max-width: 900px;
            background: #ffffff;
            margin: auto;
            padding: 30px;
            border: 2px solid #5b1184;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .college-header {
            background-color: #5b1184;
            color: white;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .college-header h2 { margin: 0; font-size: 22px; }
        .college-header p { margin: 5px 0 0; font-size: 12px; }
        
        .results-title {
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            text-decoration: underline;
            margin-bottom: 20px;
            color: #333;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .info-table td {
            border: 1px solid #444;
            padding: 8px 12px;
            font-size: 13px;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid #5b1184;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #5b1184;
            color: white;
            border-color: #5b1184;
        }
        .sem-section {
            display: none;
        }
        .sem-section.active {
            display: block;
        }
        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .marks-table th, .marks-table td {
            border: 1px solid #444;
            padding: 7px;
            text-align: center;
            font-size: 12px;
        }
        .marks-table th {
            background-color: #5b1184;
            color: white;
        }
        .marks-table td:nth-child(3) {
            text-align: left;
        }
        .summary-box {
            background: #f9f9f9;
            border: 1px solid #444;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .certificates-panel {
            border: 1px solid #b7e1cd;
            background: #e2f0d9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 25px;
        }
        .certificates-panel h4 { margin: 0 0 10px 0; color: #385723; }
        .cert-item { font-size: 13px; margin-bottom: 5px; font-weight: bold; color: #274e13; }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 30px;
            font-size: 13px;
            font-weight: bold;
            border-top: 1px dashed #999;
            padding-top: 15px;
        }
        .error-box { text-align: center; padding: 50px; color: #cc0000; }
    </style>
</head>
<body>

    <div class="memo-container" id="memoContent">
        <div class="error-box"><h2>Loading Complete Academic Record (1-1 to 4-2)...</h2></div>
    </div>

    <script>
        // Full 8-Semester Database Record Mapped by Secure Token
        const studentDatabase = {

                            { sno: 2, subCode: "CS302PC", name: "Discrete Mathematics", monthYear: "Jan 2023", grade: "B+", credits: "3.00", status: "PASS" },
                            { sno: 3, subCode: "CS303PC", name: "Computer Organization and Architecture", monthYear: "Jan 2023", grade: "B", credits: "3.00", status: "PASS" }
                        ]
                    },
                    "2-2": {

                        sgpa: "7.60",
                        subjects: [
                            { sno: 1, subCode: "CS401PC", name: "Operating Systems", monthYear: "July 2023", grade: "A+", credits: "3.00", status: "PASS" },
                            { sno: 2, subCode: "CS402PC", name: "Database Management Systems", monthYear: "July 2023", grade: "A", credits: "3.00", status: "PASS" },
                            { sno: 3, subCode: "SM403MS", name: "Business Economics and Financial Analysis", monthYear: "July 2023", grade: "B+", credits: "3.00", status: "PASS" }
                        ]
                    },
                    "3-1": {

                        sgpa: "7.80",
                        subjects: [
                            { sno: 1, subCode: "DS501PC", name: "Machine Learning", monthYear: "Jan 2024", grade: "A+", credits: "4.00", status: "PASS" },
                            { sno: 2, subCode: "DS502PC", name: "Data Warehousing and Business Intelligence", monthYear: "Jan 2024", grade: "A", credits: "3.00", status: "PASS" },
                            { sno: 3, subCode: "CS503PC", name: "Software Engineering", monthYear: "Jan 2024", grade: "B+", credits: "3.00", status: "PASS" }
                        ]
                    },
                    "3-2": {

                            { sno: 2, subCode: "DS602PC", name: "Artificial Intelligence", monthYear: "July 2024", grade: "B+", credits: "3.00", status: "PASS" },

                    },

                        ]
                    },
                    "4-2": {

                        sgpa: "6.75",
                        subjects: [
                            { sno: 1, subCode: "SM4201MS", name: "ORGANIZATIONAL BEHAVIOR", monthYear: "June 2025", grade: "C", credits: "3.00", status: "PASS" },
                            { sno: 2, subCode: "ME4233OE", name: "RENEWABLE ENERGY SOURCES", monthYear: "June 2025", grade: "C", credits: "3.00", status: "PASS" },
                            { sno: 3, subCode: "DS4206PE", name: "HUMAN COMPUTER INTERACTION", monthYear: "April 2025", grade: "C", credits: "3.00", status: "PASS" },
                            { sno: 4, subCode: "DS4202PC", name: "PROJECT STAGE - II", monthYear: "April 2025", grade: "A+", credits: "7.00", status: "PASS" }
                        ]
                    }
                }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('memoContent');

        if (token && studentDatabase[token]) {
            const student = studentDatabase[token];
            
            let tabsHTML = '';
            let sectionsHTML = '';
            let first = true;

            for (const [semKey, semData] of Object.entries(student.semesters)) {
                let activeClass = first ? 'active' : '';
                tabsHTML += `<button class="tab-btn ${activeClass}" onclick="switchSem('${semKey}', event)">Sem ${semKey}</button>`;

                let rows = '';
                semData.subjects.forEach(sub => {
                    rows += `
                        <tr>
                            <td>${sub.sno}</td>
                            <td>${sub.subCode}</td>
                            <td>${sub.name}</td>
                            <td>${sub.monthYear}</td>
                            <td>${sub.grade}</td>
                            <td>${sub.credits}</td>
                            <td>${sub.status}</td>
                        </tr>
                    `;
                });

                sectionsHTML += `
                    <div class="sem-section ${activeClass}" id="sem-${semKey}">
                        <div class="results-title">${semData.title}</div>
                        <table class="marks-table">
                            <thead>
                               <tr>
                                   <th>S.No</th><th>SubCode</th><th>Subject</th><th>Month & Year</th><th>Grades</th><th>Credits (C)</th><th>Status</th>
                               </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                        <div class="summary-box">
                            <div>Semester SGPA : ${semData.sgpa}</div>
                            <div>Status : PASSED</div>
                        </div>
                    </div>
                `;
                first = false;
            }

            container.innerHTML = `
                <div class="college-header">
                    <h2>NARSIMHA REDDY ENGINEERING COLLEGE</h2>
                    <p>Permanently Affiliated to JNTUH | Approved by AICTE, New Delhi</p>
                </div>

                <table class="info-table">
                    <tr>
                        <td><strong>H.T.No :</strong> ${student.htno}</td>
                        <td><strong>Name :</strong> ${student.name}</td>
                    </tr>
                    <tr>
                        <td><strong>Father Name :</strong> ${student.fatherName}</td>
                        <td><strong>Department :</strong> ${student.department}</td>
                    </tr>
                </table>

                <div class="certificates-panel">
                    <h4>Official Degree Credentials & Certificates Status:</h4>
                    <div class="cert-item">✔ Provisional Certificate (PCC): ${student.pccStatus}</div>
                    <div class="cert-item">✔ Consolidated Marks Memo (CMM): ${student.cmmStatus}</div>
                    <div class="cert-item" style="margin-top:8px;">Cumulative Grade Point Average (CGPA): <strong>${student.cgpa}</strong></div>
                </div>

                <div style="font-weight:bold; margin-bottom: 8px; font-size: 13px;">Select Semester Transcript:</div>
                <div class="nav-tabs">
                    ${tabsHTML}
                </div>

                ${sectionsHTML}

                <div class="footer">
                    <div>
                        <p style="margin:0; font-size:11px; color:#555;">Secure Web Verification System</p>
                        <p style="margin:2px 0 0 0; font-size:10px; color:#888;">Token ID: ${token.substring(0,12)}...</p>
                    </div>
                    <div>
                        <p style="margin-bottom: 25px;">Controller of Examinations</p>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="error-box">
                    <h2>Invalid or Expired Security Token</h2>
                    <p>The security token provided is invalid or unrecognized.</p>
                </div>
            `;
        }

        function switchSem(semKey, event) {
            document.querySelectorAll('.sem-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('sem-' + semKey).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
